name: Sync OpenAPI

# Fetches the latest OpenAPI spec + Stainless config from the private
# imagekit-sdk-config repo, regenerates the codegen output, and opens a
# PR if anything changed.
# Stainless cross-validation runs as part of `npm run generate` and surfaces
# upstream changes (new ops, renames) in the PR body and job summary.
#
# Triggers:
#   - schedule:           daily at 03:14 UTC
#   - workflow_dispatch:  manual run from the Actions tab

on:
  schedule:
    - cron: '14 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch latest spec
        run: npm run fetch-spec
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Regenerate resources
        run: |
          npm run generate 2>&1 | tee generate.log
          grep -E '^\[(warn|drift|stainless)\]|^  - ' generate.log > generate-warnings.txt || true

      - name: Write PR body
        run: |
          {
          cat <<'EOF'
          Automated sync of `imagekit-developer/imagekit-sdk-config` (private).

          - `npm run fetch-spec` pulled `default/stainless/{openapi,stainless}.yml` from `main`
          - `npm run generate` re-ran the codegen and Stainless cross-validation
          - `npm run test:generated` passes

          Review the diff under `nodes/Imagekit/resources/_generated/`
          for any user-visible changes (new operations, renamed fields,
          etc.) before merging. New unmapped operations and webhook
          events are listed below.
          EOF
          echo
          echo '### Generator warnings'
          echo
          if [ -s generate-warnings.txt ]; then
          echo '```'
          cat generate-warnings.txt
          echo '```'
          else
          echo '_None — every spec operation and webhook event is mapped._'
          fi
          } > pr-body.md
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests against regenerated resources
        run: npm test

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync OpenAPI spec from imagekit-sdk-config'
          title: 'chore: sync with latest ImageKit OpenAPI spec'
          branch: chore/sync-openapi
          delete-branch: true
          add-paths: |
            openapi/openapi.yml
            openapi/stainless.yml
            nodes/Imagekit/resources/_generated/**
          body-path: pr-body.md
