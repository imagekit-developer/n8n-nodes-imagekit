# Bumps the version, updates CHANGELOG.md, creates a GitHub Release, and
# publishes to npm — all from a single manual trigger.
#
# ─── USAGE ────────────────────────────────────────────────────────────────────
#   Actions → Release → Run workflow. With bump = auto (default) the bump is
#   inferred from conventional commits since the last tag (fix → patch,
#   feat → minor, BREAKING CHANGE / "!" → major); pick patch / minor / major
#   to override it.
#   Tick "beta" for a pre-release (e.g. 1.1.0-beta.0, published under the
#   npm `beta` dist-tag). Re-run with "beta" for beta.1, beta.2, …; a feat
#   or breaking change landing mid-beta moves the line up (1.0.7-beta.x →
#   1.1.0-beta.0). Run without "beta" to graduate to the stable version.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      beta:
        description: Beta pre-release
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # push version commit + tag, create GitHub Release
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so release-it can read all commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Bump version, update changelog, create GitHub Release
        run: npx release-it --ci ${{ inputs.bump != 'auto' && inputs.bump || '' }} ${{ inputs.beta && '--preRelease=beta' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TAG: ${{ inputs.beta && 'beta' || 'latest' }}